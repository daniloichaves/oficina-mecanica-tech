name: Security

# CodeQL e Dependency Review foram removidos: exigem GitHub Advanced Security
# (code scanning), indisponível em repositório privado de conta pessoal.
# O scan de vulnerabilidades é coberto pelo Trivy (tabela no log do job).

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check SonarQube Secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ] || [ -z "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "SONAR_CONFIGURED=false" >> $GITHUB_OUTPUT
            echo "::warning::SonarQube secrets not configured. Skipping analysis."
          else
            echo "SONAR_CONFIGURED=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check_secrets.outputs.SONAR_CONFIGURED == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        if: steps.check_secrets.outputs.SONAR_CONFIGURED == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        if: steps.check_secrets.outputs.SONAR_CONFIGURED == 'true'
        run: mvn -B clean verify

      - name: SonarQube Scan
        if: steps.check_secrets.outputs.SONAR_CONFIGURED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.projectKey=daniloichaves_oficina-mecanica-tech

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # evita resolver poms no Maven Central (runner sofre rate-limit 429)
          TRIVY_OFFLINE_SCAN: "true"
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          skip-dirs: 'target'

      - name: Trivy Dockerfile scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          format: 'table'
          severity: 'HIGH,CRITICAL'

      - name: Trivy docker-compose scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'docker-compose.yml'
          format: 'table'
          severity: 'HIGH,CRITICAL'
