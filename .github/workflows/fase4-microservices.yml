name: CI/CD Microsserviços (Fase 4)

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  verify-microservices:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: os-service
            path: fase4-priority1/os-service
          - name: billing-service
            path: fase4-priority2/billing-service
          - name: execution-service
            path: fase4-priority3/execution-service
          - name: saga-orchestrator
            path: fase4-priority4/saga-orchestrator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, testes (unit + BDD) e cobertura JaCoCo >= 80% (${{ matrix.service.name }})
        run: mvn -B -f ${{ matrix.service.path }}/pom.xml clean verify
      - name: Build Docker image (${{ matrix.service.name }})
        run: docker build -t oficina-${{ matrix.service.name }}:ci ${{ matrix.service.path }}

  deploy-k8s-smoke:
    needs: verify-microservices
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          cluster_name: oficina-fase4
      - name: Build and load microservice images into kind
        run: |
          for svc in fase4-priority1/os-service fase4-priority2/billing-service fase4-priority3/execution-service fase4-priority4/saga-orchestrator; do
            name=$(basename "$svc")
            docker build -t "ghcr.io/${{ github.repository_owner }}/oficina-${name}:latest" "$svc"
            kind load docker-image "ghcr.io/${{ github.repository_owner }}/oficina-${name}:latest" --name oficina-fase4
          done
      - name: Deploy infraestrutura e microsserviços no Kubernetes
        run: |
          kubectl apply -f k8s/fase4-infra/infra.yaml
          kubectl apply -f fase4-priority1/os-service/k8s/
          kubectl apply -f fase4-priority2/billing-service/k8s/
          kubectl apply -f fase4-priority3/execution-service/k8s/
          kubectl apply -f fase4-priority4/saga-orchestrator/k8s/
          kubectl -n oficina-fase4 rollout status deployment/os-service --timeout=180s
          kubectl -n oficina-fase4 rollout status deployment/billing-service --timeout=180s
          kubectl -n oficina-fase4 rollout status deployment/execution-service --timeout=180s
          kubectl -n oficina-fase4 rollout status deployment/saga-orchestrator --timeout=180s
