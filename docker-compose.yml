version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: oficina_mecanica
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina_mecanica"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: oficina-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  auth:
    build:
      context: ./fase3-repositories/auth-lambda
      dockerfile: Dockerfile.local
    container_name: oficina-auth
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: oficina_mecanica
      DB_USER: oficina
      DB_PASSWORD: oficina123
      DB_SSL: "false"
      JWT_SECRET: oficinaMecanicaSecretKeyForJWTTokenGeneration2024
      JWT_EXPIRATION_SECONDS: 3600
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    container_name: oficina-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/oficina_mecanica
      DB_USERNAME: oficina
      DB_PASSWORD: oficina123
      JWT_SECRET: oficinaMecanicaSecretKeyForJWTTokenGeneration2024
      JWT_EXPIRATION: 86400000
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger-ui.html"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s