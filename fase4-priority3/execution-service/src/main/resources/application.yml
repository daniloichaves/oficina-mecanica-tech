spring:
  application:
    name: execution-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/executiondb}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${APP_MESSAGING_ENABLED:false}

server:
  port: ${SERVER_PORT:8083}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  messaging:
    enabled: ${APP_MESSAGING_ENABLED:false}
    exchange: ${RABBITMQ_EXCHANGE:oficina.events}
