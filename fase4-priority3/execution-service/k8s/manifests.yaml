apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: oficina-fase4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
      annotations:
        ad.datadoghq.com/execution-service.logs: '[{"source":"java","service":"execution-service"}]'
        ad.datadoghq.com/execution-service.checks: '{"openmetrics":{"instances":[{"openmetrics_endpoint":"http://%%host%%:8083/actuator/prometheus","namespace":"oficina_execution","metrics":[".*"]}]}}'
    spec:
      containers:
        - name: execution-service
          image: ghcr.io/daniloichaves/oficina-execution-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: MONGODB_URI
              value: mongodb://mongodb-execution:27017/executiondb
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: APP_MESSAGING_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: execution-service
  namespace: oficina-fase4
spec:
  selector:
    app: execution-service
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: execution-service-hpa
  namespace: oficina-fase4
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: execution-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
