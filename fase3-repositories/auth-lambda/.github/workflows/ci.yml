name: CI/CD
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  deploy:
    if: github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=terraform init
      - run: terraform -chdir=terraform apply -auto-approve -var-file=environments/${{ github.ref_name == 'main' && 'production' || 'homologation' }}.tfvars
