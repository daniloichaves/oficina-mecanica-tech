name: Terraform CI/CD
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - if: github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - if: github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
        run: terraform init -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=kubernetes/${{ github.ref_name }}.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="use_lockfile=true"
      - if: github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
        run: terraform apply -auto-approve -var-file=environments/${{ github.ref_name == 'main' && 'production' || 'homologation' }}.tfvars
