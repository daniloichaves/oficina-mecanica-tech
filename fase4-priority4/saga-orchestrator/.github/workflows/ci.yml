name: CI/CD - saga-orchestrator

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, testes e cobertura JaCoCo >= 80%
        run: mvn -B clean verify
      - name: Análise SonarQube
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B sonar:sonar -Dsonar.host.url="$SONAR_HOST_URL"

  docker-and-deploy:
    needs: build-test-quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build imagem Docker
        run: docker build -t ghcr.io/${{ github.repository_owner }}/oficina-saga-orchestrator:${{ github.sha }} .
      - name: Deploy em Kubernetes (quando KUBE_CONFIG estiver configurado)
        if: env.KUBE_CONFIG != ''
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          kubectl apply -f k8s/
          kubectl -n oficina-fase4 rollout status deployment/saga-orchestrator --timeout=180s
