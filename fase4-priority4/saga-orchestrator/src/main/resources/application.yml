spring:
  application:
    name: saga-orchestrator
  datasource:
    url: ${DB_URL:jdbc:h2:mem:saga;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${APP_MESSAGING_ENABLED:false}

server:
  port: ${SERVER_PORT:8084}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  messaging:
    enabled: ${APP_MESSAGING_ENABLED:false}
    exchange: ${RABBITMQ_EXCHANGE:oficina.events}
  orchestration:
    remote-enabled: ${APP_ORCHESTRATION_REMOTE_ENABLED:false}
  clients:
    os-service-url: ${OS_SERVICE_URL:http://localhost:8081}
    billing-service-url: ${BILLING_SERVICE_URL:http://localhost:8082}
    execution-service-url: ${EXECUTION_SERVICE_URL:http://localhost:8083}
