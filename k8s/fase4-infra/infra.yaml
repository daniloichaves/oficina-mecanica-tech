apiVersion: v1
kind: Namespace
metadata:
  name: oficina-fase4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-os
  namespace: oficina-fase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-os
  template:
    metadata:
      labels:
        app: postgres-os
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: osdb
            - name: POSTGRES_USER
              value: oficina
            - name: POSTGRES_PASSWORD
              value: oficina123
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-os
  namespace: oficina-fase4
spec:
  selector:
    app: postgres-os
  ports:
    - port: 5432
      targetPort: 5432
---
