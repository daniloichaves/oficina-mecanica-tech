apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: oficina
  labels:
    app: traefik
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: traefik
          image: traefik:v3.7.1
          imagePullPolicy: IfNotPresent
          args:
            - --entrypoints.web.address=:8000
            - --entrypoints.traefik.address=:9000
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=oficina
            - --providers.kubernetesingress.ingressclass=traefik
            - --providers.kubernetesingress.allowemptyservices=false
            - --providers.file.filename=/etc/traefik/dynamic/dynamic.yml
            - --providers.file.watch=true
            - --api.dashboard=true
            - --api.insecure=false
            - --ping=true
            - --ping.entrypoint=traefik
            - --accesslog=true
            - --accesslog.format=json
            - --log.format=json
            - --log.level=INFO
          ports:
            - name: web
              containerPort: 8000
            - name: admin
              containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: dynamic
              mountPath: /etc/traefik/dynamic
              readOnly: true
      volumes:
        - name: dynamic
          configMap:
            name: traefik-dynamic
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: oficina
  labels:
    app: traefik
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      nodePort: 30080
