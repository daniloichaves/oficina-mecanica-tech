apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-api-public
  namespace: oficina
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /actuator/health
            pathType: Prefix
            backend:
              service:
                name: oficina-app
                port:
                  number: 8080
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: oficina-app
                port:
                  number: 8080
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: oficina-app
                port:
                  number: 8080
